aid: piestro
name: Piestro
description: >-
  Piestro was a Los Angeles-area food-robotics company that built a fully enclosed,
  automated pizza-making vending machine — an unattended kiosk that pressed, sauced,
  topped, baked, cut and boxed an artisanal pizza in roughly three minutes, sold both
  as direct-to-consumer placements and as a white-label unit for existing pizza brands.
  Founded by Massimo Noja De Marco and incubated by Wavemaker Labs (since rebranded
  Vebu Labs), it raised roughly $11.7M from equity-crowdfunding investors, largely via
  StartEngine, and piloted units with partners including Capriotti's and 800 Degrees Go.
  Piestro shut down in January 2025 without shipping a production unit. It is a hardware
  and food-service company, not a software vendor: it never ran a developer program, and
  no public API, SDK, webhook, developer portal or machine-readable contract of any kind
  was ever published. This profile records that absence rather than inventing a surface.
